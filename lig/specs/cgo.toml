name = "cgo"
description = "Rejoindre un dossier de projet"

[args]
name = "raccourci"
isOptional = true
generators = { script = '''awk -F= '/^[A-Za-z0-9._-]+=/ { print $1 }' "${XDG_CONFIG_HOME:-$HOME/.config}/cgo/shortcuts" 2>/dev/null''' }

[[options]]
name = ["-h", "--help"]
description = "Afficher l'aide"

[[subcommands]]
name = ["list", "ls"]
description = "Lister les raccourcis"

[[subcommands]]
name = "config"
description = "Afficher le chemin de la configuration"

[[subcommands]]
name = "help"
description = "Afficher l'aide"

[[subcommands]]
name = "add"
description = "Ajouter ou modifier un raccourci"
args = [
    { name = "nom", generators = { script = '''awk -F= '/^[A-Za-z0-9._-]+=/ { print $1 }' "${XDG_CONFIG_HOME:-$HOME/.config}/cgo/shortcuts" 2>/dev/null''' } },
    { name = "dossier", isOptional = true, template = "folders" },
]

[[subcommands]]
name = ["remove", "rm", "del"]
description = "Supprimer un raccourci"
args = { name = "raccourci", generators = { script = '''awk -F= '/^[A-Za-z0-9._-]+=/ { print $1 }' "${XDG_CONFIG_HOME:-$HOME/.config}/cgo/shortcuts" 2>/dev/null''' } }
